<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 232" font-family="'Noto Serif KR','Apple SD Gothic Neo',serif">
  <!-- Seok Lab 프로필 배너: 층상 산화물을 떠나는 Na 이온 (2.40 V) -->
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#e8e9ec" opacity="0.09"/>
    </pattern>
    <clipPath id="round"><rect width="880" height="232" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="880" height="232" fill="#0c0e12"/>
    <rect width="880" height="232" fill="url(#dots)"/>

    <!-- 왼쪽: 실험 장면 -->
    <g transform="translate(52,30)">
      <!-- 위층 -->
      <path d="M0 34 26 14 52 34 78 14 104 34 130 14 156 34 182 14"
            fill="none" stroke="#939aa7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- 아래층 -->
      <path d="M0 158 26 138 52 158 78 138 104 158 130 138 156 158 182 138"
            fill="none" stroke="#939aa7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- 떠난 자리 -->
      <circle cx="52" cy="86" r="15" fill="none" stroke="#697180" stroke-width="4.5" stroke-dasharray="5 7" stroke-linecap="round">
        <animate attributeName="opacity" values="0.9;0.45;0.9" dur="3.2s" repeatCount="indefinite"/>
      </circle>

      <!-- 나트륨이: 얼굴 달린 이온 -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 6 -3; 0 0" dur="0.9s" repeatCount="indefinite" calcMode="spline"
          keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
        <g>
          <animateTransform attributeName="transform" type="translate"
            values="0 0; 66 0; 66 0; 0 0" keyTimes="0; 0.42; 0.82; 1" dur="6.4s" repeatCount="indefinite"
            calcMode="spline" keySplines="0.3 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1"/>
          <circle cx="126" cy="86" r="19" fill="#a19bff"/>
          <circle cx="121" cy="82" r="5" fill="#0c0e12" opacity="0.35"/>
          <!-- 눈 (깜빡임) -->
          <g fill="#0c0e12">
            <circle cx="120" cy="85" r="2.6"/>
            <circle cx="132" cy="85" r="2.6"/>
            <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.9;0.94;0.97;1" dur="4.1s" repeatCount="indefinite"/>
          </g>
          <!-- 입 -->
          <path d="M121 92 q5 4 10 0" fill="none" stroke="#0c0e12" stroke-width="2.2" stroke-linecap="round"/>
        </g>
      </g>

      <!-- 경로 점선 + 전압 -->
      <path d="M76 86 h30" stroke="#697180" stroke-width="3" stroke-dasharray="1 9" stroke-linecap="round"/>
      <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700">
        <text x="218" y="92" fill="#e5a34f">+2.40 V
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.5;0.8;1" dur="6.4s" repeatCount="indefinite"/>
        </text>
      </g>
    </g>

    <!-- 오른쪽: 문패 -->
    <g transform="translate(340,0)">
      <text x="0" y="86" font-size="26" font-weight="700" fill="#c3c6cd">안녕하세요, Seok입니다</text>
      <text x="0" y="140" font-size="42" font-weight="900" fill="#e8e9ec" letter-spacing="-1">연구하면서, <tspan fill="#b6b1ff">개발합니다.</tspan></text>
      <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#697180">
        <text x="2" y="182">DFT 계산 노트 · EValue · 첫잔 — 그날 나온 숫자 그대로</text>
      </g>
    </g>
  </g>
  <rect width="879" height="231" x="0.5" y="0.5" rx="18" fill="none" stroke="#21252d"/>
</svg>
